services:
  - type: web
    name: postagem-automacao
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/system/status
    envVars:
      - key: PORT
        value: 3000
      - key: SIMULATE_API_PUBLISH
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: ROOT_EMAIL
        value: admin@gamefy.com
      - key: ROOT_PASSWORD
        value: GamefyAdmin2026!
      - key: IG_USER_ID
        value: "17841439279415952"
      - key: FB_PAGE_ID
        value: "1097087796819080"
      - key: FB_PAGE_TOKEN
        sync: false
      - key: IG_PAGE_TOKEN
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
